<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC2 Overlay Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="overlay-panel">
      <header class="top-line">
        <div class="top-line-main">
          <strong id="timer-value">00:00</strong>
          <span id="branch-value">Loading...</span>
        </div>
        <div id="setup-controls" class="setup-controls">
          <button id="open-builds-button" class="control-button" type="button">Builds</button>
          <button id="reload-data-button" class="control-button" type="button">Reload</button>
        </div>
      </header>
      <p id="reload-status" class="reload-status" aria-live="polite"></p>

      <section id="action-queue" class="action-queue"></section>
      <section id="upcoming-decisions" class="upcoming-decisions"></section>
      <section id="decision-content" class="decision-content"></section>

    </main>

    <script type="module" src="./renderer.ts"></script>
  </body>
  </html>
